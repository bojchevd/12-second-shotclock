<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Clock state machine tests</title>
    <style>
      body { font-family: ui-monospace, Consolas, monospace; background: #111; color: #eee; padding: 16px; line-height: 1.5; }
      .pass { color: #4ade80; }
      .fail { color: #ef4444; }
      .summary { font-size: 20px; margin-top: 16px; padding: 12px; border-radius: 6px; }
      .summary.pass { background: rgba(74,222,128,0.1); }
      .summary.fail { background: rgba(239,68,68,0.1); }
    </style>
  </head>
  <body>
    <h1>Clock state machine tests</h1>
    <div id="out"></div>
    <div id="summary"></div>
    <script type="module">
      import { tests } from './clock.test.js';
      const out = document.getElementById('out');
      const summary = document.getElementById('summary');
      let passed = 0, failed = 0;
      for (const { name, fn } of tests) {
        const line = document.createElement('div');
        try {
          fn();
          line.className = 'pass';
          line.textContent = `PASS  ${name}`;
          passed++;
        } catch (e) {
          line.className = 'fail';
          line.textContent = `FAIL  ${name}  —  ${e.message}`;
          failed++;
        }
        out.appendChild(line);
      }
      summary.className = `summary ${failed === 0 ? 'pass' : 'fail'}`;
      summary.textContent = failed === 0
        ? `All ${passed} tests passed.`
        : `${passed}/${passed + failed} passed, ${failed} failed.`;
    </script>
  </body>
</html>
